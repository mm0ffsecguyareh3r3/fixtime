name: Build Executables with PyInstaller

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: my-app-windows
            executable_path: dist/my_script.exe
          - os: ubuntu-latest
            artifact_name: my-app-linux
            executable_path: dist/my_script
          - os: macos-latest
            artifact_name: my-app-macos
            executable_path: dist/my_script

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash # Ensures consistent script execution across all OS runners

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile fixtime.py
        shell: bash

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable_path }}
          if-no-files-found: error
