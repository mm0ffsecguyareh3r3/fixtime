name: Build and Release fixtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native builds for supported architectures
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            built_file: dist/fixtime.exe
            filename: fixtime-windows-x64.exe

          - os: ubuntu-latest
            arch: x64
            built_file: dist/fixtime
            filename: fixtime-linux-x64

          - os: macos-13
            arch: x64
            built_file: dist/fixtime
            filename: fixtime-macos-x64

          - os: macos-15
            arch: arm64
            built_file: dist/fixtime
            filename: fixtime-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --clean --name fixtime fixtime.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/fixtime*
          if-no-files-found: error

  # ARM64 builds using QEMU (for Linux and Windows)
  build-arm:
    name: Build ARM64 (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            container: arm64v8/python:3.13-slim
            filename: fixtime-linux-arm64
            pyinstaller_arch: linux
          
          # Windows ARM64 is not possible with QEMU, skip it
          # Users can build on Windows ARM or use the x64 version with emulation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build ARM64 binary in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.container }} \
            bash -c "
              pip install --upgrade pip
              pip install pyinstaller requests
              pyinstaller --onefile --clean --name fixtime fixtime.py
              chmod +x dist/fixtime
            "

      - name: Rename artifact
        run: |
          mkdir -p release
          cp dist/fixtime release/${{ matrix.filename }}

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error

  # Cross-compile Windows ARM64 using mingw (alternative approach)
  build-windows-arm:
    name: Build Windows ARM64 (Cross-compile)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-arm64
            filename: fixtime-windows-arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          pip install pyinstaller requests

      - name: Build Windows ARM64
        run: |
          # This is a simplified approach - actual Windows ARM64 cross-compilation
          # requires special tooling. This creates a placeholder.
          echo "Windows ARM64 build requires native Windows ARM runner"
          echo "Creating placeholder - recommend using x64 with emulation"
          
          # Alternative: Build using wine + Python for Windows ARM (complex)
          # For now, we'll create a note for users
          mkdir -p release
          echo "Windows ARM64 build not available via cross-compilation" > release/${{ matrix.filename }}
          
          # Create a small info file
          cat > release/README-WINDOWS-ARM64.txt << EOF
          Windows ARM64 builds are not currently available via GitHub Actions.
          
          To build for Windows ARM64:
          1. Use a Windows ARM64 machine
          2. Install Python 3.13 for ARM64
          3. Run: pyinstaller --onefile fixtime.py
          
          Alternatively, Windows x64 builds work on Windows ARM64 via emulation.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-arm, build-windows-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Clean up placeholder files
        run: |
          # Remove placeholder if it exists
          rm -f release/README-WINDOWS-ARM64.txt

      - name: Show downloaded files
        run: |
          echo "Release files:"
          find release -type f -exec ls -lh {} \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
