name: Build and Release fixtime

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built_file: dist/fixtime.exe
            filename: fixtime-windows.exe

          - os: ubuntu-latest
            built_file: dist/fixtime
            filename: fixtime-linux

          - os: macos-latest
            built_file: dist/fixtime
            filename: fixtime-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller \
            --onefile \
            --clean \
            --name fixtime \
            fixtime.py

      - name: Rename executable
        shell: bash
        run: |
          mkdir release
          cp "${{ matrix.built_file }}" "release/${{ matrix.filename }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Show downloaded files
        run: find release -maxdepth 2 -type f -print

      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            release/fixtime-windows.exe \
            release/fixtime-linux \
            release/fixtime-macos \
            --repo "$GH_REPO" \
            --title "fixtime ${{ github.ref_name }}" \
            --generate-notes