name: Build and Release fixtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # =========================
          # Windows (x64 only)
          # =========================
          - os: windows-latest
            arch: x64
            built_file: dist/fixtime.exe
            filename: fixtime-windows-x64.exe

          # =========================
          # Linux
          # =========================
          - os: ubuntu-latest
            arch: x64
            built_file: dist/fixtime
            filename: fixtime-linux-x64

          # =========================
          # macOS
          # =========================
          - os: macos-13
            arch: x64
            built_file: dist/fixtime
            filename: fixtime-macos-x64

          - os: macos-15
            arch: arm64
            built_file: dist/fixtime
            filename: fixtime-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Show environment
        shell: bash
        run: |
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          python --version
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller \
            --onefile \
            --clean \
            --name fixtime \
            fixtime.py

      - name: Verify executable
        shell: bash
        run: |
          ls -lah dist/
          if [ ! -f "${{ matrix.built_file }}" ]; then
            echo "ERROR: Build output not found"
            exit 1
          fi

      - name: Rename executable
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.built_file }}" "release/${{ matrix.filename }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error

  # Separate job for ARM builds using cross-compilation
  build-arm:
    name: Build ARM Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            arch: arm64
            filename: fixtime-windows-arm64.exe
            ext: .exe
          - target: linux
            arch: arm64
            filename: fixtime-linux-arm64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build ARM64 binary
        run: |
          mkdir -p release
          
          # Build ARM64 using PyInstaller with architecture spec
          if [ "${{ matrix.target }}" = "windows" ]; then
            # Windows ARM64 - use Python cross-compilation
            python -m PyInstaller \
              --onefile \
              --clean \
              --name fixtime \
              --target-arch arm64 \
              --platform windows \
              fixtime.py
            cp dist/fixtime.exe release/${{ matrix.filename }}
          else
            # Linux ARM64
            python -m PyInstaller \
              --onefile \
              --clean \
              --name fixtime \
              --target-arch arm64 \
              --platform linux \
              fixtime.py
            cp dist/fixtime release/${{ matrix.filename }}
          fi

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Release files:"
          find release -maxdepth 1 -type f -exec ls -lh {} \;

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --repo "$GH_REPO" \
            --title "fixtime ${{ github.ref_name }}" \
            --generate-notes
