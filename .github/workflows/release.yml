name: Build and Release fixtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # Add manual trigger

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # =========================
          # Windows
          # =========================
          - os: windows-latest
            arch: x64
            built_file: dist/fixtime.exe
            filename: fixtime-windows-x64.exe

          # Windows ARM - use windows-latest with ARM64
          - os: windows-latest
            arch: arm64
            built_file: dist/fixtime.exe
            filename: fixtime-windows-arm64.exe

          # =========================
          # Linux
          # =========================
          - os: ubuntu-latest
            arch: x64
            built_file: dist/fixtime
            filename: fixtime-linux-x64

          # Linux ARM - use ubuntu-24.04 (standard, supports ARM emulation)
          - os: ubuntu-latest
            arch: arm64
            built_file: dist/fixtime
            filename: fixtime-linux-arm64

          # =========================
          # macOS
          # =========================
          # macOS Intel
          - os: macos-13
            arch: x64
            built_file: dist/fixtime
            filename: fixtime-macos-x64

          # macOS Apple Silicon
          - os: macos-15
            arch: arm64
            built_file: dist/fixtime
            filename: fixtime-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Show environment
        shell: bash
        run: |
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          python --version
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller \
            --onefile \
            --clean \
            --name fixtime \
            fixtime.py

      - name: Verify executable
        shell: bash
        run: |
          ls -lah dist/
          if [ ! -f "${{ matrix.built_file }}" ]; then
            echo "ERROR: Build output not found"
            exit 1
          fi

      - name: Rename executable
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.built_file }}" "release/${{ matrix.filename }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Release files:"
          find release -maxdepth 1 -type f -exec ls -lh {} \;

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Create release with all artifacts
          gh release create "${{ github.ref_name }}" \
            release/fixtime-windows-x64.exe \
            release/fixtime-windows-arm64.exe \
            release/fixtime-linux-x64 \
            release/fixtime-linux-arm64 \
            release/fixtime-macos-x64 \
            release/fixtime-macos-arm64 \
            --repo "$GH_REPO" \
            --title "fixtime ${{ github.ref_name }}" \
            --generate-notes
