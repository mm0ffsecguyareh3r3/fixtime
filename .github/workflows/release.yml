name: Build and Release fixtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # =========================
          # Windows (x64)
          # =========================
          - os: windows-latest
            arch: x64
            filename: fixtime-windows-x64.exe

          # =========================
          # Linux
          # =========================
          - os: ubuntu-latest
            arch: x64
            filename: fixtime-linux-x64

          # NATIVE ARM64 LINUX RUNNER!
          - os: ubuntu-22.04-arm
            arch: arm64
            filename: fixtime-linux-arm64

          # =========================
          # macOS
          # =========================
          - os: macos-13
            arch: x64
            filename: fixtime-macos-x64

          # NATIVE ARM64 MAC RUNNER!
          - os: macos-15
            arch: arm64
            filename: fixtime-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Show environment
        run: |
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          python --version
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --clean --name fixtime fixtime.py

      - name: Verify executable
        run: |
          ls -lah dist/
          if [ ! -f "dist/fixtime*" ]; then
            echo "ERROR: Build output not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/fixtime*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show downloaded files
        run: |
          echo "Release files:"
          ls -lah artifacts/
          echo ""
          echo "File details:"
          file artifacts/* 2>/dev/null || echo ""

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
