name: Build and Release fixtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # =========================
          # Windows (x64)
          # =========================
          - os: windows-latest
            arch: x64
            filename: fixtime-windows-x64.exe

          # =========================
          # Linux (x64)
          # =========================
          - os: ubuntu-latest
            arch: x64
            filename: fixtime-linux-x64

          # =========================
          # Linux ARM64 - NATIVE ARM RUNNER!
          # =========================
          - os: ubuntu-24.04-arm
            arch: arm64
            filename: fixtime-linux-arm64

          # =========================
          # macOS (Intel)
          # =========================
          - os: macos-14
            arch: x64
            filename: fixtime-macos-x64

          # =========================
          # macOS ARM64 - NATIVE ARM RUNNER!
          # =========================
          - os: macos-15
            arch: arm64
            filename: fixtime-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Show environment
        shell: bash
        run: |
          echo "OS: $(uname -s 2>/dev/null || echo Windows)"
          echo "Architecture: $(uname -m 2>/dev/null || echo Windows)"
          python --version
          python -c "import platform; print('Python architecture:', platform.machine())"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build executable
        shell: bash
        run: |
          python -m PyInstaller --onefile --clean --name fixtime fixtime.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/fixtime*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Release files:"
          ls -lah artifacts/
          echo ""
          echo "File details:"
          if command -v file &> /dev/null; then
            file artifacts/* 2>/dev/null || echo "file command not available"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
