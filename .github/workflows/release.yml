name: Build and Release fixtime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Native builds for supported architectures
  build:
    name: Build ${{ matrix.filename }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            filename: fixtime-windows-x64.exe

          - os: ubuntu-latest
            arch: x64
            filename: fixtime-linux-x64

          - os: macos-13
            arch: x64
            filename: fixtime-macos-x64

          - os: macos-15
            arch: arm64
            filename: fixtime-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --clean --name fixtime fixtime.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: dist/fixtime*
          if-no-files-found: error

  # Linux ARM64 build using QEMU emulation
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 binary
        run: |
          # Create a Dockerfile with binutils installed
          cat > Dockerfile.build << 'EOF'
          FROM arm64v8/python:3.13-slim
          
          # Install required packages for PyInstaller
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
              binutils \
              && rm -rf /var/lib/apt/lists/*
          
          WORKDIR /build
          COPY fixtime.py .
          
          RUN pip install --upgrade pip && \
              pip install pyinstaller requests
          
          RUN pyinstaller --onefile --clean --name fixtime fixtime.py
          
          # Verify the binary
          RUN file dist/fixtime
          EOF

          # Build using docker buildx with ARM64 platform
          docker buildx build \
            --platform linux/arm64 \
            --output type=local,dest=./dist-arm64 \
            -f Dockerfile.build \
            .

      - name: Rename artifact
        run: |
          mkdir -p release
          cp dist-arm64/fixtime release/fixtime-linux-arm64
          chmod +x release/fixtime-linux-arm64

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixtime-linux-arm64
          path: release/fixtime-linux-arm64
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show downloaded files
        run: |
          echo "Release files:"
          ls -lah artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
